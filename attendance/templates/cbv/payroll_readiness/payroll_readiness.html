{% extends "index.html" %}
{% load i18n %}

{% block content %}
<div class="oh-wrapper">
    {% if not current_company %}
        <div class="oh-alert oh-alert--info mt-4">
            {% trans "Select a single company (not \"All Companies\") to view Payroll Readiness." %}
        </div>
    {% else %}
        <div x-data="{tab: 'live_preview'}">
            <div class="oh-tabs mb-3" style="display:flex; gap:0.5rem; border-bottom:1px solid #e0e0e0;">
                <button type="button"
                    @click="tab = 'live_preview'"
                    :class="tab === 'live_preview' ? 'oh-btn oh-btn--secondary' : 'oh-btn oh-btn--light-bkg'">
                    {% trans "Live Preview" %}
                </button>
                <button type="button"
                    @click="tab = 'final_report'"
                    :class="tab === 'final_report' ? 'oh-btn oh-btn--secondary' : 'oh-btn oh-btn--light-bkg'">
                    {% trans "Final Report" %}
                </button>
            </div>

            <div x-show="tab === 'live_preview'"
                hx-get="{% url 'payroll-readiness-live-preview' %}" hx-trigger="load" hx-target="this" hx-swap="innerHTML"></div>

            <div x-show="tab === 'final_report'" x-cloak
                hx-get="{% url 'payroll-readiness-final-report' %}" hx-trigger="load" hx-target="this" hx-swap="innerHTML"></div>
        </div>
    {% endif %}
</div>
{% include "generic/components.html" %}
{% endblock content %}
